name: Desktop package CI

on:
  pull_request:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: desktop-package-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  package:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Linux x64
            runner: ubuntu-24.04
            os: linux
            bundles: deb,appimage
            artifact: linux-x64
          - name: Windows x64
            runner: windows-2025
            os: windows
            bundles: msi,nsis
            artifact: windows-x64
          - name: macOS ARM64
            runner: macos-15
            os: macos
            bundles: app,dmg
            artifact: macos-arm64
          - name: macOS Intel
            runner: macos-15-intel
            os: macos
            bundles: app,dmg
            artifact: macos-x64

    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - uses: astral-sh/setup-uv@08807647e7069bb48b6ef5acd8ec9567f424441b
        with:
          python-version: "3.12"
      - name: Install Linux desktop dependencies
        if: matrix.os == 'linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf
      - run: npm ci
      - run: npm run engine:setup
      - run: npm run release:check-version
      - run: npm run engine:bundle
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos' && '-' || '' }}
      - run: npm run bridge:jmp:build
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos' && '-' || '' }}
      - run: npm run bridge:sas:build
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos' && '-' || '' }}
      - run: npm run bridge:windows-com:build
        if: matrix.os == 'windows'
      - name: Build finished installers
        run: npm run tauri -- build --bundles "${{ matrix.bundles }}"
        env:
          APPLE_SIGNING_IDENTITY: ${{ matrix.os == 'macos' && '-' || '' }}
      - name: Smoke-test finished installers
        run: npm run release:smoke-package
      - run: npm run release:package-bridges
      - run: npm run release:manifest
      - run: npm run release:verify
      - name: Preserve installers and diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: statdata-package-${{ matrix.artifact }}-${{ github.run_number }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            src-tauri/target/release/bundle
            release-packages
            release-metadata
