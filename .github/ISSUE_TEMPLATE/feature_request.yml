name: Format or feature request
description: Propose a format, conversion direction, or application improvement
title: "[Feature]: "
labels:
  - enhancement
body:
  - type: textarea
    id: need
    attributes:
      label: User need
      description: Explain the workflow or problem this would address.
    validations:
      required: true
  - type: input
    id: formats
    attributes:
      label: Formats and versions
      placeholder: "Minitab 22 .mwx read and write"
  - type: textarea
    id: fidelity
    attributes:
      label: Required fidelity
      description: List data, labels, missing values, date/time, or metadata requirements.
  - type: textarea
    id: evidence
    attributes:
      label: Available fixtures or vendor access
      description: Describe redistributable fixtures or licensed software available for validation.
