[package]
name = "statdata-converter-desktop"
version = "0.10.0"
description = "Local-first statistical data converter"
authors = ["StatData Converter contributors"]
license = "Apache-2.0"
repository = ""
edition = "2021"
rust-version = "1.84"

[lib]
name = "statdata_converter_desktop_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"
tauri-plugin-shell = "2"
